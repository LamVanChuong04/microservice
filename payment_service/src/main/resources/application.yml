spring:
  application:
    name: payment_service

  datasource:
    url: ${DBMS_CONNECTION:jdbc:mysql://localhost:3306/payment_service}
    username: ${DBMS_USERNAME:root}
    password: ${DBMS_PASSWORD:250104}
  jpa:
    hibernate:
      ddl-auto: update
    database: mysql
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format-sql: true
    show-sql: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      properties:
        delivery.timeout.ms: 30000
        request.timeout.ms: 15000
        linger.ms: 0

    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      key-deserialize: org.apache.kafka.common.serialization.StringDeserializer
      value-deserialize: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

server:
  port: 8084
